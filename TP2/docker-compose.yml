name: velib-pipeline

x-postgres-env: &pg-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: velib
  POSTGRES_USER: velib
  POSTGRES_PASSWORD: velib

services:

  # ---------- transport ----------
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------- collecte ----------
  producer:
    build: ./api
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: velib-status
      POLL_INTERVAL: 60
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  source2:
    build: ./source2
    environment:
      DATALAKE_PATH: /datalake
      FETCH_INTERVAL: 3600
    volumes:
      - ./datalake/data:/datalake
    restart: unless-stopped

  # ---------- agrégation -> data lake ----------
  aggregator:
    build: ./aggregation
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: velib-status
      DATALAKE_PATH: /datalake
      BATCH_SECONDS: 60
    volumes:
      - ./datalake/data:/datalake
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ---------- traitement ----------
  spark:
    build: ./spark
    user: root
    environment:
      <<: *pg-env
      DATALAKE_PATH: /datalake
      SPARK_INTERVAL: 120
    volumes:
      - ./datalake/data:/datalake
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- stockage ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: velib
      POSTGRES_USER: velib
      POSTGRES_PASSWORD: velib
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velib -d velib"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- data viz ----------
  dataviz:
    build: ./dataviz
    environment: *pg-env
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- monitoring ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # lecture seule sans login pour la démo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/velib.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://velib:velib@postgres:5432/velib?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml
    volumes:
      - ./monitoring/postgres-queries.yaml:/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  prometheus-data:
  grafana-data:
